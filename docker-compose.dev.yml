volumes:
  pg_data:

services:
  backend:
    build:
      context: ./src/api
      dockerfile: Dockerfile.api
    #expose:
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    networks:
      - appnet
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # s3handler:
      #   condition: service_healthy
      email-worker:
        condition: service_healthy
    # restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
  frontend:
    build:
      context: ./src/web
      dockerfile: Dockerfile.dev
    networks:
      - appnet
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    # restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
  
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - appnet
    # restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]

  redis:
    image: redis:latest
    networks:
      - appnet
    ports:
      - "6379:6379"
    # restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]
  
  # s3handler:
  #   image: s3handler:latest
  #   networks:
  #     - appnet
  #   # expose at random port, internally backend fetches from 8000
  #   ports:
  #     - "33333:8000"
  #   env_file:
  #     - ./.env
  #   # restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 10s

  email-worker:
    build:
      context: ./src/api
      dockerfile: Dockerfile.email
    env_file:
      - ./.env
    networks:
      - appnet
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    # restart: unless-stopped
    # Optional: Override command to specify queues and concurrency
    # command: ["uv", "run", "celery", "-A", "celery_worker", "worker", "--loglevel=info", "-Q", "email,default", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "uv run celery -A celery_worker inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  flower:
    build:
      context: ./src/api
      dockerfile: Dockerfile.flower
    env_file:
      - ./.env
    networks:
      - appnet
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      email-worker:
        condition: service_healthy
    # restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5555/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  appnet:
