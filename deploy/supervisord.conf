[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=0
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; Lower priority starts first. Redis and Typesense must be up before the API and workers.
[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --protected-mode yes --daemonize no
directory=/var/lib/redis
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:typesense]
command=typesense-server --data-dir /var/lib/typesense --api-key "%(ENV_TYPESENSE_API_KEY)s" --api-address 127.0.0.1 --api-port 8108 --enable-cors
directory=/var/lib/typesense
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=uv run main.py
directory=/app
user=appuser
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
environment=HOME="/home/appuser",PATH="/app/.venv/bin:/usr/local/bin:/usr/bin:/bin",PYTHONPATH="/app",PYTHONUNBUFFERED="1",UV_NO_SYNC="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:email-worker]
command=uv run celery -A celery_worker worker --loglevel=debug -P gevent -Q email --concurrency=200
directory=/app
user=appuser
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
environment=HOME="/home/appuser",PATH="/app/.venv/bin:/usr/local/bin:/usr/bin:/bin",PYTHONPATH="/app",PYTHONUNBUFFERED="1",UV_NO_SYNC="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:conversion-worker]
command=uv run celery -A celery_cpu_worker worker --loglevel=info -P prefork -Q cpu --concurrency=1 -B
directory=/app
user=appuser
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
environment=HOME="/home/appuser",PATH="/app/.venv/bin:/usr/local/bin:/usr/bin:/bin",PYTHONPATH="/app",PYTHONUNBUFFERED="1",UV_NO_SYNC="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:titiler]
command=/opt/titiler/bin/uvicorn titiler.application.main:app --host 127.0.0.1 --port 8001 --workers 1
directory=/tmp
user=appuser
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
environment=HOME="/home/appuser",PATH="/opt/titiler/bin:/usr/local/bin:/usr/bin:/bin",CPL_TMPDIR="/tmp",GDAL_CACHEMAX="75%%",GDAL_DISABLE_READDIR_ON_OPEN="EMPTY_DIR",GDAL_HTTP_MERGE_CONSECUTIVE_RANGES="YES",GDAL_HTTP_MULTIPLEX="YES",GDAL_HTTP_VERSION="2",VSI_CACHE="TRUE",VSI_CACHE_SIZE="536870912",TITILER_API_CORS_ORIGINS="*"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
