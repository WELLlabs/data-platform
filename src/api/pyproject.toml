[project]
name = "data-welllabs-api"
version = "0.1.0"
description = "API infrastructure for Data Portal of WELL Labs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.2",
    "fastapi-users>=14.0.1",
    "uvicorn>=0.35.0",
    "SQLAlchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.0.8",
    "fastapi-users-db-sqlalchemy>=6.0.0",
    "pydantic-settings>=2.6.1",
    "alembic>=1.16.5",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.1",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.1",
    "boto3>=1.35.0",
    "bleach>=6.3.0",
    "celery[redis]>=5.6.2",
    "brevo-python>=1.2.0",
    "gevent>=25.9.1",
    "flower>=2.0.1",
]
