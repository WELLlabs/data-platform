<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ email_title }}</title>
</head>
<body style="margin:0;padding:0;background-color:#F7F7F3;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17202A;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F7F7F3;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;">
          <tr>
            <td style="padding:0 8px 20px 8px;">
              <p style="margin:0;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#667085;font-weight:500;">Open environmental data</p>
              <p style="margin:6px 0 0 0;font-size:15px;font-weight:600;letter-spacing:0.08em;color:#0B1F33;">{{ sender_name }}</p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#FCFCFA;border:1px solid #E7E6DF;border-radius:10px;padding:32px 28px;">
              {{{ content }}}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 8px 0 8px;">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#8a93a0;">
                This message was sent by {{ sender_name }}{% if host_name %} for {{ host_name }}{% endif %}.
                If you were not expecting it, you can ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
