services:
  backend:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    #expose:
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    networks:
      - appnet
    depends_on:
      redis:
        condition: service_healthy
      s3handler:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
  frontend:
    build:
      context: ./src/web
      dockerfile: Dockerfile.prod
    networks:
      - appnet
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - /home/ubuntu/.ssl-certs/data.welllabs.org:/etc/letsencrypt/live/data.welllabs.org:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
  
  redis:
    image: redis:latest
    networks:
      - appnet
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]
  
  s3handler:
    image: s3handler:latest
    networks:
      - appnet
    # expose at random port, internally backend fetches from 8000
    ports:
      - "33333:8000"
    env_file:
      - ./.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  appnet:
