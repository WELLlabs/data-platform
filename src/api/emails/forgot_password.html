<p style="margin:0 0 8px 0;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#667085;font-weight:500;">Password reset</p>
<h1 style="margin:0 0 16px 0;font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:500;letter-spacing:-0.02em;color:#0B1F33;">Reset your password</h1>
<p style="margin:0 0 16px 0;font-size:15px;line-height:1.6;color:#31404f;">Hi {{ full_name }}, we received a request to reset the password for {{ email }}.</p>
<p style="margin:0 0 24px 0;font-size:15px;line-height:1.6;color:#31404f;">Use the button below to choose a new password. The link expires after a limited time.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="border-radius:7px;background-color:#0B1F33;">
      <a href="{{ reset_link }}" style="display:inline-block;padding:11px 18px;font-size:14px;font-weight:500;color:#ffffff;text-decoration:none;">Reset password</a>
    </td>
  </tr>
</table>
<p style="margin:24px 0 0 0;font-size:13px;line-height:1.55;color:#667085;word-break:break-all;">If the button does not work, copy this link:<br /><a href="{{ reset_link }}" style="color:#1769AA;">{{ reset_link }}</a></p>
